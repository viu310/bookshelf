
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f5f1e8;
  --card: #fffdf8;
  --green: #354b3d;
  --text: #333b32;
  --muted: #89877c;
  --line: #e8e1d5;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
}

/* 상단 */
header {
  max-width: 1200px;
  margin: auto;
  padding: 28px 30px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--green);
}

.header-count {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
}

/* 메인 제목 */
.intro {
  max-width: 1200px;
  margin: auto;
  padding: 28px 30px 45px;
}

.intro h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(35px, 5vw, 49px);
  font-weight: 400;
  color: var(--green);
}

.intro p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 10px;
  font-weight: 300;
}

/* 전체 책장 */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 0 30px 90px;
}

/*
  핵심 구조:
  book-row 하나가 책 5권과 독후감 영역을 모두 포함
*/
.book-row {
  display: flex;
  flex-direction: column;
  gap: 22px;
  margin-bottom: 48px;
}

/* 책 5권만 들어가는 독립 그리드 */
.book-items {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 24px;
}

/* 개별 책 */
.book-card {
  min-width: 0;
}

/* 책 표지 버튼 */
.cover-button {
  width: 100%;
  border: none;
  padding: 0;
  background: none;
  cursor: pointer;
  display: block;
  text-align: left;
}

.cover-wrap {
  width: 100%;
  aspect-ratio: 2 / 3;
  background: #e8e0d3;
  position: relative;
  overflow: hidden;
  box-shadow: 3px 5px 12px rgba(0,0,0,.10);
  transition: transform .3s, box-shadow .3s;
}

.cover-button:hover .cover-wrap {
  transform: translateY(-5px);
  box-shadow: 5px 12px 20px rgba(0,0,0,.14);
}

.cover-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.cover-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: #d9d0c0;
  color: #fffdf8;
}

.cover-placeholder span {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
}

.cover-placeholder small {
  margin-top: 10px;
  font-size: 10px;
  letter-spacing: 2px;
}

/* 표지 클릭 안내 */
.review-hint {
  font-size: 10px;
  color: #a39b8b;
  text-align: center;
  margin-top: 11px;
}

/* 책 정보 */
.book-info {
  padding-top: 13px;
}

.book-number {
  font-family: 'DM Serif Display', serif;
  font-size: 11px;
  color: #a69c89;
  letter-spacing: 1.5px;
  margin-bottom: 7px;
}

.book-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--green);
  line-height: 1.5;
  word-break: keep-all;
}

.book-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.7;
}

/*
  독후감 영역:
  book-items와 완전히 분리된 별도 영역
  따라서 책 5권의 배열에 영향을 주지 않음
*/
.review-panel {
  display: none;
  width: 100%;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--green);
  padding: 30px 34px;
  animation: reveal .3s ease;
}

.review-panel.open {
  display: block;
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.review-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: #a39883;
  margin-bottom: 13px;
}

.review-heading {
  font-family: 'DM Serif Display', serif;
  font-size: 25px;
  font-weight: 400;
  color: var(--green);
  margin-bottom: 16px;
}

.review-content {
  font-size: 15px;
  font-weight: 300;
  line-height: 2.1;
  color: #5f6057;
  word-break: keep-all;
  white-space: pre-line;
}

.review-close {
  border: none;
  background: none;
  color: #999181;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  margin-top: 22px;
}

.review-close:hover {
  color: var(--green);
}

/* 하단 */
footer {
  border-top: 1px solid var(--line);
  text-align: center;
  padding: 30px 15px;
  color: #999181;
  font-family: 'DM Serif Display', serif;
  font-size: 14px;
}

/* 태블릿 */
@media (max-width: 900px) {
  .book-items {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
  }
}

/* 모바일 */
@media (max-width: 550px) {
  header {
    padding: 22px 18px 15px;
  }

  .intro {
    padding: 25px 18px 35px;
  }

  .container {
    padding: 0 18px 65px;
  }

  .book-items {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 25px 16px;
  }

  .book-title {
    font-size: 13px;
  }

  .review-panel {
    padding: 23px 19px;
  }

  .review-content {
    font-size: 14px;
  }

  .book-row {
    margin-bottom: 38px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Book Archive</div>
</header>

<section class="intro">
  <h1>Book Archive</h1>
  <p>책 10권 읽기 BINGO</p>
</section>

<main class="container">
  <div id="bookGrid"></div>
</main>

<footer>
  Every book leaves a story.
</footer>

<script>

// ========================================
// 1. 책 정보 입력
// ========================================

const books = [
  {
    title: "이방인",
    author: "알베르 카뮈",
    publisher: "민음사",
    cover: "images/The stranger.png",
    review: "이곳에 이방인을 읽고 느꼈던 생각을 적어주세요."
  },
  {
    title: "책 제목 02",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-02.jpg",
    review: "두 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 03",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-03.jpg",
    review: "세 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 04",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-04.jpg",
    review: "네 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 05",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-05.jpg",
    review: "다섯 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 06",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-06.jpg",
    review: "여섯 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 07",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-07.jpg",
    review: "일곱 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 08",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-08.jpg",
    review: "여덟 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 09",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-09.jpg",
    review: "아홉 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 10",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-10.jpg",
    review: "열 번째 책의 독후감을 작성하세요."
  }
];

// ========================================
// 2. 책 카드 생성
// ========================================

const grid = document.getElementById("bookGrid");

// 현재 열려 있는 독후감 영역
let activePanel = null;
let activeBookIndex = null;

function createBookCard(book, index, panel) {

  const number = String(index + 1).padStart(2, "0");

  const card = document.createElement("article");
  card.className = "book-card";

  // 표지 버튼
  const button = document.createElement("button");
  button.className = "cover-button";
  button.type = "button";
  button.setAttribute("aria-expanded", "false");

  const wrap = document.createElement("div");
  wrap.className = "cover-wrap";

  // 이미지가 없을 경우 표시할 기본 표지
  const placeholder = document.createElement("div");
  placeholder.className = "cover-placeholder";

  const placeholderTitle = document.createElement("span");
  placeholderTitle.textContent = "MY BOOK";

  const placeholderNumber = document.createElement("small");
  placeholderNumber.textContent = `NO. ${number}`;

  placeholder.append(placeholderTitle, placeholderNumber);

  // 실제 책 표지
  const img = document.createElement("img");
  img.src = book.cover;
  img.alt = `${book.title} 책 표지`;
  img.loading = "lazy";

  img.onload = () => {
    placeholder.style.display = "none";
  };

  img.onerror = () => {
    img.style.display = "none";
    placeholder.style.display = "flex";
  };

  wrap.append(placeholder, img);
  button.appendChild(wrap);

  // 클릭 안내
  const hint = document.createElement("div");
  hint.className = "review-hint";
  hint.textContent = "표지를 눌러 독후감 보기 ↓";

  // 책 정보
  const info = document.createElement("div");
  info.className = "book-info";

  const bookNumber = document.createElement("div");
  bookNumber.className = "book-number";
  bookNumber.textContent = `BOOK NO. ${number}`;

  const title = document.createElement("h2");
  title.className = "book-title";
  title.textContent = book.title;

  const meta = document.createElement("div");
  meta.className = "book-meta";
  meta.textContent = `${book.author} · ${book.publisher}`;

  info.append(bookNumber, title, meta);

  card.append(button, hint, info);

  // 표지 클릭 이벤트

  button.addEventListener("click", () => {

    const isSameBook = activePanel === panel &&
                      activeBookIndex === index;

    // 같은 책을 다시 누르면 독후감 닫기
    if (isSameBook) {

      panel.classList.remove("open");

      const row = card.closest(".book-row");

      row.querySelectorAll(".cover-button").forEach(btn => {
        btn.setAttribute("aria-expanded", "false");
      });

      row.querySelectorAll(".review-hint").forEach(el => {
        el.textContent = "표지를 눌러 독후감 보기 ↓";
      });

      activePanel = null;
      activeBookIndex = null;

      return;
    }

    // 이전에 열려 있던 독후감 초기화
    if (activePanel) {

      const previousRow = activePanel.row;

      // 다른 줄이라면 기존 독후감 닫기
      if (activePanel.panel !== panel) {
        activePanel.panel.classList.remove("open");
      }

      previousRow.querySelectorAll(".cover-button").forEach(btn => {
        btn.setAttribute("aria-expanded", "false");
      });

      previousRow.querySelectorAll(".review-hint").forEach(el => {
        el.textContent = "표지를 눌러 독후감 보기 ↓";
      });
    }

    // 선택한 책의 독후감 내용으로 교체
    panel.querySelector(".review-label").textContent =
      `MY REVIEW · BOOK ${String(index + 1).padStart(2, "0")}`;

    panel.querySelector(".review-heading").textContent =
      book.title;

    panel.querySelector(".review-content").textContent =
      book.review;

    // 독후감 영역 표시
    panel.classList.add("open");

    button.setAttribute("aria-expanded", "true");
    hint.textContent = "독후감이 펼쳐졌습니다 ↑";

    // 현재 선택 정보 저장
    activePanel = {
      panel: panel,
      row: card.closest(".book-row")
    };

    activeBookIndex = index;

    // 부드럽게 스크롤
    requestAnimationFrame(() => {
      panel.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    });

  });


  return card;
}

// ========================================
// 3. 독후감 영역 생성
// ========================================

function createReviewPanel() {

  const panel = document.createElement("section");
  panel.className = "review-panel";

  const label = document.createElement("div");
  label.className = "review-label";
  label.textContent = "MY REVIEW";

  const heading = document.createElement("h3");
  heading.className = "review-heading";

  const content = document.createElement("p");
  content.className = "review-content";

  const close = document.createElement("button");
  close.className = "review-close";
  close.type = "button";
  close.textContent = "독후감 접기 ↑";

  close.addEventListener("click", () => {

    panel.classList.remove("open");

    const row = panel.closest(".book-row");

    row.querySelectorAll(".cover-button").forEach(btn => {
      btn.setAttribute("aria-expanded", "false");
    });

    row.querySelectorAll(".review-hint").forEach(el => {
      el.textContent = "표지를 눌러 독후감 보기 ↓";
    });

    activePanel = null;
  });

  panel.append(label, heading, content, close);

  return panel;
}

// ========================================
// 4. 10권을 5권씩 두 개의 책장으로 분리
// ========================================

for (let rowIndex = 0; rowIndex < 2; rowIndex++) {

  // 독립된 책장
  const row = document.createElement("section");
  row.className = "book-row";

  // 책 5권만 들어가는 그리드
  const items = document.createElement("div");
  items.className = "book-items";

  const start = rowIndex * 5;
  const end = start + 5;

  const rowBooks = books.slice(start, end);

  // 이 줄만 사용하는 독후감 영역
  const panel = createReviewPanel();

  // 책 5권 생성
  rowBooks.forEach((book, i) => {

    const index = start + i;

    const card = createBookCard(
      book,
      index,
      panel
    );

    items.appendChild(card);
  });

  /*
    핵심:
    책 5권 그리드와 독후감 영역은
    서로 다른 형제 요소로 배치됩니다.

    따라서 독후감이 열려도
    책 5권의 가로 배열은 유지됩니다.
  */
  row.appendChild(items);
  row.appendChild(panel);

  grid.appendChild(row);
}

</script>

</body>
</html>
