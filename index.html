
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #f5f1e8;
  --card: #fffdf8;
  --green: #354b3d;
  --text: #333b32;
  --muted: #89877c;
  --line: #e8e1d5;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
}

/* 상단 */
header {
  max-width: 1200px;
  margin: auto;
  padding: 28px 30px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--green);
}

.header-count {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
}

/* 제목 */
.intro {
  max-width: 1200px;
  margin: auto;
  padding: 28px 30px 45px;
}

.intro h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(35px, 5vw, 49px);
  font-weight: 400;
  color: var(--green);
}

.intro p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 10px;
  font-weight: 300;
}

/* 책 목록 */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 0 30px 90px;
}

.book-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 38px 24px;
}

.book-card {
  min-width: 0;
}

/* 표지 */
.cover-button {
  width: 100%;
  border: none;
  padding: 0;
  background: none;
  cursor: pointer;
  display: block;
  position: relative;
  overflow: hidden;
}

.cover-wrap {
  width: 100%;
  aspect-ratio: 2 / 3;
  background: #e8e0d3;
  position: relative;
  overflow: hidden;
  box-shadow: 3px 5px 12px rgba(0,0,0,.10);
  transition: transform .3s, box-shadow .3s;
}

.cover-button:hover .cover-wrap {
  transform: translateY(-5px);
  box-shadow: 5px 12px 20px rgba(0,0,0,.14);
}

.cover-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.cover-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: #d9d0c0;
  color: #fffdf8;
}

.cover-placeholder span {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
}

.cover-placeholder small {
  margin-top: 10px;
  font-size: 10px;
  letter-spacing: 2px;
}

/* 클릭 안내 */
.review-hint {
  font-size: 10px;
  color: #a39b8b;
  text-align: center;
  margin-top: 11px;
}

/* 책 정보 */
.book-info {
  padding-top: 13px;
}

.book-number {
  font-family: 'DM Serif Display', serif;
  font-size: 11px;
  color: #a69c89;
  letter-spacing: 1.5px;
  margin-bottom: 7px;
}

.book-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--green);
  line-height: 1.5;
  word-break: keep-all;
}

.book-meta {
  font-size: 11px;
  color: var(--muted);
  margin-top: 6px;
  line-height: 1.7;
}

/* 독후감 드롭다운 */
.review-panel {
  display: none;
  grid-column: 1 / -1;
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--green);
  padding: 28px 32px;
  margin-top: -18px;
  animation: reveal .3s ease;
}

.review-panel.open {
  display: block;
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.review-label {
  font-size: 10px;
  letter-spacing: 2px;
  color: #a39883;
  margin-bottom: 13px;
}

.review-heading {
  font-family: 'DM Serif Display', serif;
  font-size: 23px;
  color: var(--green);
  margin-bottom: 15px;
}

.review-content {
  font-size: 15px;
  font-weight: 300;
  line-height: 2.1;
  color: #5f6057;
  word-break: keep-all;
}

.review-close {
  border: none;
  background: none;
  color: #999181;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  margin-top: 20px;
}

/* 하단 */
footer {
  border-top: 1px solid var(--line);
  text-align: center;
  padding: 30px 15px;
  color: #999181;
  font-family: 'DM Serif Display', serif;
  font-size: 14px;
}

/* 태블릿 */
@media (max-width: 900px) {
  .book-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 32px 20px;
  }
}

/* 모바일 */
@media (max-width: 550px) {
  header {
    padding: 22px 18px 15px;
  }

  .intro {
    padding: 25px 18px 35px;
  }

  .container {
    padding: 0 18px 65px;
  }

  .book-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 28px 16px;
  }

  .book-title {
    font-size: 13px;
  }

  .review-panel {
    padding: 23px 19px;
  }

  .review-content {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Book Archive.</div>
  <div class="header-count">10 SELECTED BOOKS</div>
</header>

<section class="intro">
  <h1>My Reading Archive</h1>
  <p>책을 읽고, 생각을 기록하고, 마음에 남기다.</p>
</section>

<main class="container">
  <div class="book-grid" id="bookGrid"></div>
</main>

<footer>
  Every book leaves a story.
</footer>

<script>

// ===================================
// 책 10권 정보 수정하는 곳
// ===================================

const books = [
  {
    title: "이방인",
    author: "알베르 카뮈",
    publisher: "열린책들",
    cover: "images/The Stranger.jpg",
    review: "이곳에 첫 번째 책의 독후감을 작성하세요. 책을 읽으며 느꼈던 감정과 인상 깊었던 내용을 자유롭게 기록하면 됩니다."
  },
  {
    title: "책 제목 02",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-02.jpg",
    review: "두 번째 책을 읽고 느낀 점을 기록하세요."
  },
  {
    title: "책 제목 03",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-03.jpg",
    review: "세 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 04",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-04.jpg",
    review: "네 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 05",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-05.jpg",
    review: "다섯 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 06",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-06.jpg",
    review: "여섯 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 07",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-07.jpg",
    review: "일곱 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 08",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-08.jpg",
    review: "여덟 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 09",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-09.jpg",
    review: "아홉 번째 책의 독후감을 작성하세요."
  },
  {
    title: "책 제목 10",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-10.jpg",
    review: "열 번째 책의 독후감을 작성하세요."
  }
];

// ===================================
// 화면 생성
// ===================================

const grid = document.getElementById("bookGrid");
let activePanel = null;

books.forEach((book, index) => {

  const card = document.createElement("article");
  card.className = "book-card";

  const number = String(index + 1).padStart(2, "0");

  const button = document.createElement("button");
  button.className = "cover-button";
  button.type = "button";
  button.setAttribute("aria-expanded", "false");
  button.setAttribute("aria-label", `${book.title} 독후감 펼치기`);

  const wrap = document.createElement("div");
  wrap.className = "cover-wrap";

  const placeholder = document.createElement("div");
  placeholder.className = "cover-placeholder";

  const placeholderTitle = document.createElement("span");
  placeholderTitle.textContent = "MY BOOK";

  const placeholderNumber = document.createElement("small");
  placeholderNumber.textContent = `NO. ${number}`;

  placeholder.append(placeholderTitle, placeholderNumber);

  const img = document.createElement("img");
  img.src = book.cover;
  img.alt = `${book.title} 책 표지`;
  img.loading = "lazy";

  img.onload = () => {
    placeholder.style.display = "none";
  };

  img.onerror = () => {
    img.style.display = "none";
    placeholder.style.display = "flex";
  };

  wrap.append(placeholder, img);
  button.appendChild(wrap);

  const hint = document.createElement("div");
  hint.className = "review-hint";
  hint.textContent = "표지를 눌러 독후감 보기 ↓";

  const info = document.createElement("div");
  info.className = "book-info";

  const bookNumber = document.createElement("div");
  bookNumber.className = "book-number";
  bookNumber.textContent = `BOOK NO. ${number}`;

  const title = document.createElement("h2");
  title.className = "book-title";
  title.textContent = book.title;

  const meta = document.createElement("div");
  meta.className = "book-meta";
  meta.textContent = `${book.author} · ${book.publisher}`;

  info.append(bookNumber, title, meta);
  card.append(button, hint, info);

  // 독후감 영역
  const panel = document.createElement("section");
  panel.className = "review-panel";
  panel.setAttribute("aria-label", `${book.title} 독후감`);

  const label = document.createElement("div");
  label.className = "review-label";
  label.textContent = `MY REVIEW · BOOK ${number}`;

  const heading = document.createElement("h3");
  heading.className = "review-heading";
  heading.textContent = book.title;

  const content = document.createElement("p");
  content.className = "review-content";
  content.textContent = book.review;

  const close = document.createElement("button");
  close.className = "review-close";
  close.type = "button";
  close.textContent = "접기 ↑";

  panel.append(label, heading, content, close);

  button.addEventListener("click", () => {
    const isOpen = panel.classList.contains("open");

    if (activePanel) {
      activePanel.panel.classList.remove("open");
      activePanel.button.setAttribute("aria-expanded", "false");
      activePanel.hint.textContent = "표지를 눌러 독후감 보기 ↓";
    }

    if (!isOpen) {
      panel.classList.add("open");
      button.setAttribute("aria-expanded", "true");
      hint.textContent = "독후감이 펼쳐졌습니다 ↑";

      activePanel = { panel, button, hint };

      requestAnimationFrame(() => {
        panel.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });
      });
    } else {
      activePanel = null;
    }
  });

  close.addEventListener("click", () => {
    panel.classList.remove("open");
    button.setAttribute("aria-expanded", "false");
    hint.textContent = "표지를 눌러 독후감 보기 ↓";
    activePanel = null;
  });

  grid.append(card, panel);
});

</script>

</body>
</html>
