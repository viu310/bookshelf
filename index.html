
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Archive</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>
  <div class="logo">Book Archive</div>
</header>

<section class="intro">
  <h1>10 Archive</h1>
  <p>책 10권 읽기 BINGO</p>
</section>

<main class="container">
  <div id="bookGrid"></div>
</main>

<footer>
  <div class="reading-progress">
    <span id="reviewProgress">0/10</span>
  </div>
</footer>

<script>

// ========================================
// 1. 책 정보 입력
// ========================================

const books = [
  {
    title: "이방인",
    author: "알베르 카뮈",
    publisher: "열린책들",
    cover: "images/The stranger.png",
    review: `
    주인공 뫼르소는 전형적인 소시오패스같다는 생각이 들었다. 항상 수동적인 모습을 보여준다.
    내 주변에 뫼르소같은 인물이 있다면 나도 아마 뫼르소를 무슨생각을 하는지 모르겠지만 의리있고 진국인 친구라고 생각할지도 모르겠다.
    주변에 무심한 것 같으면서도 모든 일을 다 알고 있고 주변인들에게 별 감정이 없는 것 같지만 항상 도와준다.
    어머니의 장례식에서 울지 않아서 냉혈한으로 취급받고 살인사건 재판에서 불리하게 작용한다.
    뫼르소가 자신의 가치를 사제에게 가감없이 분출하는 장면이 있는데 그때 왜 책 제목이 이방인인지 알 수 있는 부분이었다.
    뫼르소는 종국에 가서야 죽음으로서 자신이 행복하다고 말한다.
    항소가 받아들여지길 바라면서도 항소를 하지도 않는 이 모순적인 인물이 뫼르소(이방인) 그 자체이고
    인생에서 자신이 이방인이라고 생각하는 사람들이 얼마나 많을까 생각하게 된다.
    `
  },
  {
    title: "총균쇠",
    author: "재레드 다이아몬드",
    publisher: "김영사",
    cover: "images/총균쇠.png",
    review: ""
  },
  {
    title: "책 제목 03",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-03.jpg",
    review: ""
  },
  {
    title: "책 제목 04",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-04.jpg",
    review: ""
  },
  {
    title: "책 제목 05",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-05.jpg",
    review: ""
  },
  {
    title: "책 제목 06",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-06.jpg",
    review: ""
  },
  {
    title: "책 제목 07",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-07.jpg",
    review: ""
  },
  {
    title: "책 제목 08",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-08.jpg",
    review: ""
  },
  {
    title: "책 제목 09",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-09.jpg",
    review: ""
  },
  {
    title: "책 제목 10",
    author: "저자 이름",
    publisher: "출판사",
    cover: "images/book-10.jpg",
    review: ""
  }
];

// ========================================
// 독후감 작성 현황 카운터
// ========================================

const progressElement = document.getElementById("reviewProgress");

function updateReviewProgress() {

  // 실제 독후감 내용이 입력된 책만 카운트
  const completedCount = books.filter(book =>
    book.review.trim() !== ""
  ).length;

  progressElement.textContent = `${completedCount}/${books.length}`;
}

// 페이지 최초 실행
updateReviewProgress();

// ========================================
// 2. 책 카드 생성
// ========================================

const grid = document.getElementById("bookGrid");

// 현재 열려 있는 독후감 영역
let activePanel = null;

// ========================================
// 독후감 닫기 공통 함수
// ========================================

function closeReviewPanel(panel) {

  panel.classList.remove("open");

  const row = panel.closest(".book-row");

  row.querySelectorAll(".cover-button").forEach(btn => {
    btn.setAttribute("aria-expanded", "false");
  });

  row.querySelectorAll(".review-hint").forEach(el => {
    el.textContent = "표지를 눌러 독후감 보기 ↓";
  });

  // 현재 열린 독후감 초기화
  if (activePanel?.panel === panel) {
    activePanel = null;
  }
}

function createBookCard(book, index, panel) {

  const number = String(index + 1).padStart(2, "0");

  const card = document.createElement("article");
  card.className = "book-card";

  // 표지 버튼
  const button = document.createElement("button");
  button.className = "cover-button";
  button.type = "button";
  button.setAttribute("aria-expanded", "false");

  const wrap = document.createElement("div");
  wrap.className = "cover-wrap";

  // 이미지가 없을 경우 표시할 기본 표지
  const placeholder = document.createElement("div");
  placeholder.className = "cover-placeholder";

  const placeholderTitle = document.createElement("span");
  placeholderTitle.textContent = "MY BOOK";

  const placeholderNumber = document.createElement("small");
  placeholderNumber.textContent = `NO. ${number}`;

  placeholder.append(placeholderTitle, placeholderNumber);

  // 실제 책 표지
  const img = document.createElement("img");
  img.src = book.cover;
  img.alt = `${book.title} 책 표지`;
  img.loading = "lazy";

  img.onload = () => {
    placeholder.style.display = "none";
  };

  img.onerror = () => {
    img.style.display = "none";
    placeholder.style.display = "flex";
  };

  wrap.append(placeholder, img);
  button.appendChild(wrap);

  // 클릭 안내
  const hint = document.createElement("div");
  hint.className = "review-hint";
  hint.textContent = "표지를 눌러 독후감 보기 ↓";

  // 책 정보
  const info = document.createElement("div");
  info.className = "book-info";

  const bookNumber = document.createElement("div");
  bookNumber.className = "book-number";
  bookNumber.textContent = `BOOK NO. ${number}`;

  const title = document.createElement("h2");
  title.className = "book-title";
  title.textContent = book.title;

  const meta = document.createElement("div");
  meta.className = "book-meta";
  meta.textContent = `${book.author} · ${book.publisher}`;

  info.append(bookNumber, title, meta);

  card.append(button, hint, info);

  // 표지 클릭 이벤트

  // ========================================
  // 책 표지 클릭 이벤트
  // ========================================

  button.addEventListener("click", () => {

    const currentRow = card.closest(".book-row");

    // 이미 선택한 책인지 확인
    const isSameBook =
      activePanel?.panel === panel &&
      activePanel?.bookIndex === index;

    // 같은 책을 다시 누르면 닫기
    if (isSameBook) {

      closeReviewPanel(panel);

      return;
    }

    // 이전 독후감이 열려 있다면 닫기
    if (activePanel) {
      closeReviewPanel(activePanel.panel);
    }

    // 선택한 책의 독후감 내용으로 교체
    panel.querySelector(".review-label").textContent =
      `MY REVIEW · BOOK ${String(index + 1).padStart(2, "0")}`;

    panel.querySelector(".review-heading").textContent =
      book.title;

    panel.querySelector(".review-content").textContent =
      book.review || "아직 작성된 독후감이 없습니다.";

    // 독후감 영역 열기
    panel.classList.add("open");

    // 선택 상태 변경
    button.setAttribute("aria-expanded", "true");
    hint.textContent = "ㅤ";

    // 현재 선택 정보 저장
    activePanel = {
      panel: panel,
      row: currentRow,
      bookIndex: index
    };

    // 부드럽게 스크롤
    requestAnimationFrame(() => {
      panel.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    });

  });


  return card;
}

// ========================================
// 3. 독후감 영역 생성
// ========================================

function createReviewPanel() {

  const panel = document.createElement("section");
  panel.className = "review-panel";

  const label = document.createElement("div");
  label.className = "review-label";
  label.textContent = "MY REVIEW";

  const heading = document.createElement("h3");
  heading.className = "review-heading";

  const content = document.createElement("p");
  content.className = "review-content";

  const close = document.createElement("button");
  close.className = "review-close";
  close.type = "button";
  close.textContent = "▲ 닫기";

  close.addEventListener("click", () => {
    closeReviewPanel(panel);
  });

  panel.append(label, heading, content, close);

  return panel;
}

// ========================================
// 4. 10권을 5권씩 두 개의 책장으로 분리
// ========================================

for (let rowIndex = 0; rowIndex < 2; rowIndex++) {

  // 독립된 책장
  const row = document.createElement("section");
  row.className = "book-row";

  // 책 5권만 들어가는 그리드
  const items = document.createElement("div");
  items.className = "book-items";

  const start = rowIndex * 5;
  const end = start + 5;

  const rowBooks = books.slice(start, end);

  // 이 줄만 사용하는 독후감 영역
  const panel = createReviewPanel();

  // 책 5권 생성
  rowBooks.forEach((book, i) => {

    const index = start + i;

    const card = createBookCard(
      book,
      index,
      panel
    );

    items.appendChild(card);
  });

  /*
    핵심:
    책 5권 그리드와 독후감 영역은
    서로 다른 형제 요소로 배치됩니다.

    따라서 독후감이 열려도
    책 5권의 가로 배열은 유지됩니다.
  */
  row.appendChild(items);
  row.appendChild(panel);

  grid.appendChild(row);
}

</script>

</body>
</html>
